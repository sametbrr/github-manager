# Release: Python package (PyPI)
# Triggers: a version bump in pyproject.toml on __DEFAULT_BRANCH__ (the tag v<version> is created
# if missing), or a tag v<version> you push yourself (also works for dynamic, tag-based versions).
# Then: build sdist + wheel, publish to PyPI, create a GitHub release with the files attached.
# Auth: PyPI trusted publishing. On pypi.org add a trusted publisher for this repo, workflow
# "release.yml" and environment "pypi". No token secret needed. Only the publish job uses the
# "pypi" environment, so ordinary pushes are never held by environment protection rules.
name: Release

on:
  push:
    branches: ['__DEFAULT_BRANCH__']
    tags: ['v*']
    paths: [pyproject.toml]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check ref
        env:
          DEFAULT_BRANCH: '__DEFAULT_BRANCH__'
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            COMMIT=$(git rev-parse "${GITHUB_SHA}^{commit}")
            if ! git merge-base --is-ancestor "$COMMIT" "origin/$DEFAULT_BRANCH"; then
              echo "::error::tag $GITHUB_REF_NAME points to a commit that is not on $DEFAULT_BRANCH"; exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::releases run only from $DEFAULT_BRANCH (got $GITHUB_REF_NAME)"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve version
        id: v
        run: |
          VERSION=$(python3 - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
          print(data.get("project", {}).get("version") or data.get("tool", {}).get("poetry", {}).get("version") or "")
          PY
          )
          if [ -z "$VERSION" ] && [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VERSION" ]; then echo "::notice::version is dynamic; push a tag v<version> to release"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$TAG" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $VERSION"; exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "create_tag=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag
        if: steps.v.outputs.create_tag == 'true'
        env:
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Build
        if: steps.v.outputs.release == 'true'
        run: |
          python3 -m pip install --upgrade build
          python3 -m build

      - uses: actions/upload-artifact@v4
        if: steps.v.outputs.release == 'true'
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Release $TAG already exists."; exit 0; fi
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
