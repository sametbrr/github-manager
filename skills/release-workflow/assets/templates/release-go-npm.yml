# Release: Go CLI distributed as GitHub binaries + an npm wrapper package in __NPM_DIR__/
# Trigger: push a tag v<version> (`git tag v1.2.3 && git push origin v1.2.3`). Go modules take
# their version from the tag, so there is no version file to bump.
# Then: test, cross-compile __BIN__ for 6 targets, create a GitHub release with the binaries,
# checksums.txt and generated notes. The version is injected as main.version.
# A second job publishes the npm wrapper in __NPM_DIR__/ with the same version (provenance on;
# remove --provenance for private repos). Auth: NPM_TOKEN secret or npm trusted publishing.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check ref
        env:
          DEFAULT_BRANCH: '__DEFAULT_BRANCH__'
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            COMMIT=$(git rev-parse "${GITHUB_SHA}^{commit}")
            if ! git merge-base --is-ancestor "$COMMIT" "origin/$DEFAULT_BRANCH"; then
              echo "::error::tag $GITHUB_REF_NAME points to a commit that is not on $DEFAULT_BRANCH"; exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::releases run only from $DEFAULT_BRANCH (got $GITHUB_REF_NAME)"; exit 1
          fi

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build
        env:
          CGO_ENABLED: '0'
          BIN: '__BIN__'
          MAIN: '__GO_MAIN__'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            ext=""; [ "$GOOS" = windows ] && ext=".exe"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${BIN}-${GOOS}-${GOARCH}${ext}" "$MAIN"
          done
          (cd dist && sha256sum "${BIN}"-* > checksums.txt)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "Release exists."; exit 0; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  npm:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - name: Publish the npm wrapper
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIR: '__NPM_DIR__'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for f in README.md LICENSE; do [ -f "$f" ] && cp "$f" "$NPM_DIR/"; done
          cd "$NPM_DIR"
          NAME=$(jq -r '.name' package.json)
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm; skipping."
            exit 0
          fi
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --provenance --access public
